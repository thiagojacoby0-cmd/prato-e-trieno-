include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File(settingsDir, 'capacitor-cordova-android-plugins')

apply from: 'capacitor.settings.gradle'

def capacitorNodeDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
def capacitorBundledDir = new File(settingsDir, 'capacitor-android')
if (new File(capacitorNodeDir, 'build.gradle').exists()) {
    project(':capacitor-android').projectDir = capacitorNodeDir
} else if (new File(capacitorBundledDir, 'build.gradle').exists()) {
    project(':capacitor-android').projectDir = capacitorBundledDir
}